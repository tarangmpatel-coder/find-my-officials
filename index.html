<!DOCTYPE html>
<html>
<head>
<title>Find My Officials</title>
<style>
body{
font-family:Arial;
max-width:800px;
margin:auto;
padding:20px;
}
input{
width:100%;
padding:10px;
font-size:16px;
}
button{
padding:10px 20px;
margin-top:10px;
}
pre{
background:#f5f5f5;
padding:15px;
margin-top:20px;
}
</style>
</head>
<body>

<h1>Find My Government Representatives</h1>

<input id="address" placeholder="Enter Address">

<button onclick="lookup()">
Search
</button>

<pre id="result"></pre>

<script>
async function lookup(){

const address =
document.getElementById("address").value;

const apiKey = "AIzaSyB-NkkRFEONNwxFVqKmt5gJ5w5lPiqxit8"

const url =
`https://www.googleapis.com/civicinfo/v2/representatives?address=${encodeURIComponent(address)}&key=${apiKey}`;

const response =
await fetch(url);

const data =
await response.json();

document.getElementById("result").textContent =
JSON.stringify(data,null,2);
}
</script>

</body>
</html>
